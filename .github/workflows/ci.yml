name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever is still running for the same ref: the older
# run's result is about to be irrelevant, and cancelling it frees a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The suite runs test files serially (see vitest.config.ts) because Shiki's
    # highlighter warm-up is paid per worker and contends for cores. A healthy
    # run takes a couple of minutes, but that warm-up degrades sharply under
    # contention, so a slow run here is not automatically a hung one. Without a
    # ceiling a genuinely stuck run would hold a runner for the 6h default;
    # 20 minutes is well past any healthy run and bounds the damage.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the `engines` floor declared in package.json. Raising one
          # without the other would let CI pass on a version consumers are told
          # is unsupported, or the reverse.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
