name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever is still running for the same ref: the older
# run's result is about to be irrelevant, and cancelling it frees a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A healthy run is a few minutes: the suite itself takes seconds now that
    # highlighter grammars load on demand, and install and build dominate.
    # Without a ceiling a stuck run would hold a runner for the 6h default;
    # 20 minutes is well past any healthy run and bounds the damage.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Matches the `engines` floor declared in package.json. Raising one
          # without the other would let CI pass on a version consumers are told
          # is unsupported, or the reverse.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
